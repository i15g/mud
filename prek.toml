[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
    { id = "mixed-line-ending" },
]

[[repos]]
repo = "https://github.com/dnephin/pre-commit-golang"
rev = "v0.5.1"
hooks = [
    { id = "go-fmt" },
    { id = "go-vet" },
    { id = "go-unit-tests" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks" },
]
