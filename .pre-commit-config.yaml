# Lockfiles are tool-generated (mise checks a digest of its .mise/locks sidecars); never reformat
exclude: \.lock$|-lock\.(json|ya?ml)$|^\.mise/locks/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # `mise exec -- <tool>`: tool pinned in mise.toml, regardless of PATH
  - repo: local
    hooks:
      # vet + test already compile, so no separate go build
      - id: go-fmt
        name: gofmt
        entry: mise exec -- gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: mise exec -- go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go test
        entry: mise exec -- go test ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: mise exec -- prettier --write
        language: system
        types_or: [json, markdown, yaml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
